name: test
on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run action
        uses: ./

      - name: Run action with inputs
        uses: ./
        with:
          html-path: dist/index.html
          measurement-id: G-XXXXXXXXXX
