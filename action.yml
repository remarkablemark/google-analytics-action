name: google-analytics-action
description: Inject Google Analytics tracking code into an HTML file with GitHub Actions
author: remarkablemark

inputs:
  html-path:
    description: Path to the HTML file to modify
    required: true

  measurement-id:
    description: Google Analytics Measurement ID (e.g., G-XXXXXXXXXX)
    required: true

runs:
  using: composite
  steps:
    - name: Inject Google Analytics script
      shell: bash
      run: bash "${GITHUB_ACTION_PATH}/scripts/inject.sh"
      env:
        HTML_PATH: ${{ inputs.html-path }}
        MEASUREMENT_ID: ${{ inputs.measurement-id }}

branding:
  icon: bar-chart
  color: orange
